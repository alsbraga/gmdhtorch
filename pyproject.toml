[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmdhtorch"
version = "0.2.0"
description = "Group Method of Data Handling (O-GMDH & C-GMDH) in PyTorch"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "André Braga", email = "alsbraga@gmail.com" },
]
keywords = ["gmdh", "pytorch", "polynomial-neural-networks", "system-identification", "reinforcement-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/alsbraga/gmdhtorch"
Repository = "https://github.com/alsbraga/gmdhtorch"
Issues = "https://github.com/alsbraga/gmdhtorch/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
